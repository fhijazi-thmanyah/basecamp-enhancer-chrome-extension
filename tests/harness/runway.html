<!doctype html><html><head><meta charset="utf-8"><title>Test message</title>

<script src="/stub.js"></script><script src="/ext/content.js"></script></head>
<body style="background:#fff;font-family:sans-serif">
<main class="perma" style="width:700px;margin:0 auto">
 <h1>رسالة اختبار</h1>
 <article class="thread-entry recording" id="__recording_333"><div class="formatted_content">فارس، نقدر نعتمد Databricks بدل Accounts add-on؟</div></article>
 <article class="thread-entry recording" id="__recording_334"><div class="formatted_content">another comment</div></article>
 <article class="thread-entry thread-entry--form">[comment composer]</article>
</main>
<turbo-frame src="/4149173/my/sidebar/circles/48437449" style="position:fixed;right:10px;bottom:10px;width:360px;height:420px;border:1px solid #999;background:#fff;display:block">
 <!-- real Basecamp shape (verified live 2026-10-12): a grid room whose lines are a column-REVERSE bc-infinite-page -->
 <bc-chat-room class="chat__room" style="height:100%;display:grid;grid-template-rows:auto 1fr auto"><header class="chat__header">ping</header><bc-infinite-page class="chat__lines" style="display:flex;flex-direction:column-reverse;overflow:auto;min-height:0"><bc-grouped-dates style="display:block"><div style="padding:8px">محمد: قديم</div><div style="padding:8px">محمد: تذكير بموعد أناناس</div></bc-grouped-dates></bc-infinite-page><footer class="chat__footer" style="display:flex;flex-direction:column"><div class="chat__typing-status"></div><div class="chat__container">[composer]</div></footer></bc-chat-room>
</turbo-frame>
<pre id="out"></pre>
<script>
const out = (k, v) => { document.getElementById("out").textContent += k + "=" + JSON.stringify(v) + "\n"; };
const q = (s) => document.querySelector(s);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener("load", async () => {
  await wait(800);
  out("slotBeforeForm", q(".bce-rw-slot")?.nextElementSibling?.classList.contains("thread-entry--form"));
  out("inlineCards", document.querySelectorAll(".bce-rw-slot > .bce-rw").length);
  out("inlineTo", q(".bce-rw-slot .bce-rw__to")?.textContent);
  out("replytoMarked", q("#__recording_333").classList.contains("bce-rw-replyto"));
  out("chatCards", document.querySelectorAll(".chat__footer > .bce-rw-slot > .bce-rw").length);
  out("chatAboveComposer", q(".chat__footer > .bce-rw-slot")?.nextElementSibling?.classList.contains("chat__container"));
  out("chatNotInLines", !q(".chat__lines .bce-rw"));
  { const c = q(".chat__footer .bce-rw")?.getBoundingClientRect(), l = q(".chat__lines").getBoundingClientRect(), k = q(".chat__container").getBoundingClientRect();
    out("chatVisibleBetweenLinesAndComposer", !!c && c.top >= l.bottom - 1 && c.bottom <= k.top + 1 && c.height > 0); }
  out("fab", q(".bce-rwfab")?.textContent);
  { const c = q(".bce-rw-slot .bce-rw"), more = c.querySelector(".bce-rw__more");
    out("longClamped", c.classList.contains("bce-rw--clamped") && !more.hidden);
    out("clampHeightLe3Lines", c.querySelector(".bce-rw__body").clientHeight <= 3 * 21 + 2);
    more.click(); out("expanded", c.classList.contains("bce-rw--open") && more.textContent.startsWith("less"));
    more.click(); out("collapsed", !c.classList.contains("bce-rw--open"));
    out("shortNoToggle", q(".chat__footer .bce-rw .bce-rw__more").hidden); }
  if (location.hash === "#shot") { q(".bce-rwfab").click(); await wait(300); return; }
  q(".bce-rwfab").click(); await wait(200);
  out("panelCards", document.querySelectorAll(".bce-rwpanel .bce-rw").length);
  out("panelFirstIsHere", q(".bce-rwpanel .bce-rw").dataset.file);
  q(".bce-rwfab").click(); await wait(100);
  out("panelClosed", !q(".bce-rwpanel"));
  const card = q(".bce-rw-slot .bce-rw");
  const btn = (c, t) => [...c.querySelectorAll("button")].find((b) => b.textContent.startsWith(t));
  btn(card, "Edit").click();
  out("editorShown", !card.querySelector(".bce-rw__edit").hidden);
  card.querySelector(".bce-rw__edit").value = "نص معدل";
  btn(card, "Save").click(); await wait(100);
  out("bodyAfterEdit", card.querySelector(".bce-rw__body").textContent);
  out("editPayload", window.__log.filter((m) => m.type === "hqAction").pop().payload);
  card.querySelector(".bce-rw__rev").value = "اختصرها";
  btn(card, "✨").click(); await wait(100);
  out("bodyAfterRevise", card.querySelector(".bce-rw__body").textContent);
  btn(card, "Send").click();
  out("armed", btn(card, "Confirm") ? true : false);
  out("noSendYet", !window.__log.some((m) => m.payload && m.payload.action === "send"));
  btn(card, "Confirm").click(); await wait(100);
  out("sent", window.__log.filter((m) => m.type === "hqAction").pop().payload);
  out("inlineAfterSend", document.querySelectorAll(".bce-rw-slot .bce-rw").length);
  out("emptyBarShown", q("main .bce-rw-empty")?.textContent);
  out("emptyBarBeforeForm", q("main .bce-rw-slot")?.nextElementSibling?.classList.contains("thread-entry--form"));
  const cc = q(".chat__footer .bce-rw");
  btn(cc, "Reject").click(); await wait(100);
  out("chatAfterReject", document.querySelectorAll(".chat__footer .bce-rw").length);
  out("fabAfter", q(".bce-rwfab")?.textContent);
  out("chatEmptyBar", q(".chat__footer .bce-rw-empty")?.textContent);
  q("main .bce-rw-empty__btn").click(); await wait(200);
  out("draftReq", window.__log.filter((m) => m.type === "hqDraft").pop());
  out("drafting", q("main .bce-rw-empty")?.textContent);
  await wait(6000);
  out("landedCard", q("main .bce-rw-slot > .bce-rw .bce-rw__body")?.textContent);
  out("emptyGone", !q("main .bce-rw-empty"));
  out("DONE", true);
});
</script></body></html>
